<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영어 단어 객관식 퀴즈</title>
  <!-- Supabase JavaScript v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .quiz-card {
      background: var(--card);
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      padding: 28px;
      border: 1px solid var(--border);
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .attempt-badge {
      background: #f1f5f9;
      padding: 4px 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.8rem;
    }

    .word-box {
      text-align: center;
      padding: 28px 16px;
      background: #f8fafc;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .word-box h1 {
      font-size: 2.2rem;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    .options-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.05rem;
      text-align: left;
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      color: var(--text);
      font-weight: 500;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eef2ff;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: #dcfce7;
      color: #14532d;
      font-weight: 700;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: #fee2e2;
      color: #7f1d1d;
    }

    .feedback-area {
      min-height: 54px;
      margin-bottom: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .feedback-msg {
      font-weight: 700;
    }

    .feedback-msg.correct { color: var(--success); }
    .feedback-msg.wrong { color: var(--danger); }

    .save-status {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .save-status.ok { color: var(--success); }
    .save-status.fail { color: var(--danger); }

    .action-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .action-btn:hover {
      opacity: 0.92;
    }

    .hidden {
      display: none;
    }

    .result-box {
      text-align: center;
      padding: 20px 0;
    }

    .score-text {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <!-- 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="quiz-header">
        <span id="progress-text">문제 1 / 3</span>
        <span id="attempt-display" class="attempt-badge"></span>
      </div>

      <div class="word-box">
        <h1 id="english-word">abundant</h1>
      </div>

      <div id="options-container" class="options-grid"></div>

      <div class="feedback-area">
        <div id="feedback-msg" class="feedback-msg"></div>
        <div id="save-status" class="save-status"></div>
      </div>

      <button id="next-btn" class="action-btn hidden">다음 문제</button>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="result-box hidden">
      <h2>퀴즈 완료!</h2>
      <div id="final-score" class="score-text">0 / 3점</div>
      <p id="final-attempt" style="color: var(--muted); font-size: 0.85rem; margin-bottom: 24px;"></p>
      <button id="retry-btn" class="action-btn">다시 풀기</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. Supabase 설정 (값을 교체해 주세요)
    // ==========================================
    const SUPABASE_URL = "https://nxhlhphlvtfkzqowsuil.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Ku-5XOTN8Xy9HviBIBwKxg_F5K515Rb";

    let supabaseClient = null;
    try {
      if (SUPABASE_URL.startsWith("http")) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      }
    } catch (err) {
      console.error("Supabase 클라이언트 초기화 오류:", err);
    }

    // ==========================================
    // 2. 퀴즈 문제 데이터
    // ==========================================
    const QUIZ_DATA = [
      {
        question_no: 1,
        english_word: "abundant",
        options: ["조용한", "풍부한", "위험한", "느린"],
        answer: "풍부한"
      },
      {
        question_no: 2,
        english_word: "reluctant",
        options: ["주저하는", "열정적인", "정확한", "부지런한"],
        answer: "주저하는"
      },
      {
        question_no: 3,
        english_word: "brief",
        options: ["강력한", "평범한", "짧은", "불규칙한"],
        answer: "짧은"
      }
    ];

    // ==========================================
    // 3. 상태 변수
    // ==========================================
    let attemptId = "";
    let currentIndex = 0;
    let score = 0;
    let questionStartTime = 0;
    let isAnswered = false;

    // DOM 요소
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const progressText = document.getElementById("progress-text");
    const attemptDisplay = document.getElementById("attempt-display");
    const englishWordEl = document.getElementById("english-word");
    const optionsContainer = document.getElementById("options-container");
    const feedbackMsg = document.getElementById("feedback-msg");
    const saveStatus = document.getElementById("save-status");
    const nextBtn = document.getElementById("next-btn");
    const finalScore = document.getElementById("final-score");
    const finalAttempt = document.getElementById("final-attempt");
    const retryBtn = document.getElementById("retry-btn");

    // ==========================================
    // 4. 퀴즈 시작 및 문제 렌더링
    // ==========================================
    function startQuiz() {
      attemptId = crypto.randomUUID();
      currentIndex = 0;
      score = 0;

      quizScreen.classList.remove("hidden");
      resultScreen.classList.add("hidden");
      attemptDisplay.textContent = "응시 ID: " + attemptId.slice(0, 8) + "...";

      renderQuestion();
    }

    function renderQuestion() {
      isAnswered = false;
      const q = QUIZ_DATA[currentIndex];

      progressText.textContent = `문제 ${q.question_no} / ${QUIZ_DATA.length}`;
      englishWordEl.textContent = q.english_word;
      feedbackMsg.textContent = "";
      feedbackMsg.className = "feedback-msg";
      saveStatus.textContent = "";
      saveStatus.className = "save-status";
      nextBtn.classList.add("hidden");

      optionsContainer.innerHTML = "";
      q.options.forEach((optText) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = optText;
        btn.addEventListener("click", () => handleSelectAnswer(optText, btn));
        optionsContainer.appendChild(btn);
      });

      // 문제 제시 시점 기록
      questionStartTime = performance.now();
    }

    // ==========================================
    // 5. 답안 선택 처리 및 Supabase INSERT
    // ==========================================
    async function handleSelectAnswer(chosenAnswer, clickedBtn) {
      // 한 문제에 한 번만 선택 가능하도록 잠금
      if (isAnswered) return;
      isAnswered = true;

      // 응답 시간(밀리초, 0 이상 정수) 계산
      const elapsed = Math.max(0, Math.round(performance.now() - questionStartTime));
      const q = QUIZ_DATA[currentIndex];
      const isCorrect = (chosenAnswer === q.answer);

      if (isCorrect) {
        score++;
      }

      // 모든 보기 버튼 비활성화 및 정오답 색상 표시
      const allButtons = optionsContainer.querySelectorAll(".option-btn");
      allButtons.forEach((btn) => {
        btn.disabled = true;
        if (btn.textContent === q.answer) {
          btn.classList.add("correct");
        } else if (btn === clickedBtn && !isCorrect) {
          btn.classList.add("wrong");
        }
      });

      // 즉시 정오답 피드백 표시
      if (isCorrect) {
        feedbackMsg.textContent = `정답입니다! (${(elapsed / 1000).toFixed(2)}초)`;
        feedbackMsg.classList.add("correct");
      } else {
        feedbackMsg.textContent = `오답입니다. 정답은 '${q.answer}'입니다. (${(elapsed / 1000).toFixed(2)}초)`;
        feedbackMsg.classList.add("wrong");
      }

      // 다음 문제 / 결과 보기 버튼 노출 (저장에 실패해도 퀴즈는 계속 진행 가능)
      nextBtn.textContent = (currentIndex < QUIZ_DATA.length - 1) ? "다음 문제" : "결과 보기";
      nextBtn.classList.remove("hidden");

      // Supabase에 단일 INSERT 실행 (.select() 사용하지 않음)
      await saveAnswerToSupabase({
        attempt_id: attemptId,
        question_no: q.question_no,
        english_word: q.english_word,
        chosen_answer: chosenAnswer,
        is_correct: isCorrect,
        response_time_ms: elapsed
      });
    }

    async function saveAnswerToSupabase(payload) {
      saveStatus.textContent = "응답 저장 중...";
      saveStatus.className = "save-status";

      if (!supabaseClient) {
        saveStatus.textContent = "저장 실패: Supabase URL과 키를 설정해 주세요. (퀴즈는 계속됩니다)";
        saveStatus.className = "save-status fail";
        return;
      }

      try {
        const { error } = await supabaseClient
          .from("quiz_answers")
          .insert(payload);

        if (error) {
          throw error;
        }

        saveStatus.textContent = "✓ Supabase에 응답이 저장되었습니다.";
        saveStatus.className = "save-status ok";
      } catch (err) {
        console.error("Supabase INSERT 오류:", err);
        saveStatus.textContent = "저장 실패 (퀴즈는 계속 진행할 수 있습니다)";
        saveStatus.className = "save-status fail";
      }
    }

    // ==========================================
    // 6. 다음 문제 이동 및 다시 풀기 이벤트
    // ==========================================
    nextBtn.addEventListener("click", () => {
      if (currentIndex < QUIZ_DATA.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showResult();
      }
    });

    function showResult() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      finalScore.textContent = `${score} / ${QUIZ_DATA.length}점`;
      finalAttempt.textContent = `응시 번호(attempt_id): ${attemptId}`;
    }

    retryBtn.addEventListener("click", () => {
      startQuiz();
    });

    // 앱 최초 실행
    startQuiz();
  </script>
</body>
</html>
